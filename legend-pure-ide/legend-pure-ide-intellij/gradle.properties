# Tell Gradle where to find the JBR 21 bundled with IntelliJ IDEA Ultimate.
# Required because the JBR is installed inside the .app bundle, which Gradle
# does not auto-detect. Update this path if you move IntelliJ.
org.gradle.java.installations.paths=/Users/rohitpant/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home

# Run the Gradle daemon itself on JBR 21 (required for intellijPlatform plugin v2+)
org.gradle.java.home=/Users/rohitpant/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home